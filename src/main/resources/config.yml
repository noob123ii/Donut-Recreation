    BanTime: lifetime
    ResetData: true
  "ESP / Bariton":
    BanTime: 1mo
    ResetData: true
  Macroing:
    BanTime: 7d
    ResetData: false
  Cheating:
    BanTime: 30d
    ResetData: true
  Xray:
    BanTime: lifetime
    ResetData: true
  BaseFinding:
    BanTime: 14d
    ResetData: false

alt-ban-policy: new-accounts-only
alt-ban-account-min-age-hours: 168

sus:
