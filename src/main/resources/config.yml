logging:
  enabled: true
  fine: true   # enabled for detailed debugging

hider:
  enabled: true

  # --- World ---
  # Reduced radius (2 chunks) for lower TPS impact on slow servers.
  # Underground reveals persist when player surfaces to avoid hide-packet spikes.
  hide-below-y: 0
  barrier-upper-y: 10
  upper-reveal-radius: 2

  world-min-y: -64
  creative-spectator-radius-reveal: false

  reveal-initial-radius: 2
  reveal-movement-radius: 1
  reveal-edge-extra-radius: 0

  # Lower = less memory / chunk tracking overhead
  sticky-radius: 2
  max-revealed-chunks-per-player: 512
  max-reveal-hide-per-recompute: 32

  # --- Tile Entities ---
  tile-entity-mask-enabled: true
  tile-entity-render-distance: 16
  tile-entity-mask-above-range: 32

  # --- Recompute ---
  # Slower recalcs = less spam and better TPS stability
  recompute-period-ticks: 30
  recompute-min-ticks: 10

  # --- Flood Fill (main cost) ---
  # Reduced for small server - still functional but less CPU intensive
  flood-fill-budget: 5000
  flood-fill-block-radius: 32
  flood-fill-throttle-ticks: 40

  # --- Entities ---
  entity-scan-chunk-radius: 4

  # --- Geodes ---
  geode-hide-enabled: true
  geode-reveal-radius: 3
  max-geode-chunks: 1024

  # --- Spawns ---
  block-natural-spawns-below-hide: true
  block-all-spawns-below-hide: false

  # --- Anti-xray ---
  # Seed-based ore hiding - no disk cache needed
  decoy-amethyst-enabled: true
  decoy-amethyst-rate-bits: 13

  # Less CPU churn
  salt-rotate-period-ticks: 24000
  salt-rotate-stagger-ticks: 20

  # --- Void Protection ---
  void-redirect-server: ""
  void-spawn-world: "world"
  void-spawn-x: 0
  void-spawn-y: 100
  void-spawn-z: 0
  void-spawn-yaw: 0
  void-spawn-pitch: 0

  # --- Misc ---
  verbose-logging: false

punishments:
  Krypton:
    BanTime: lifetime
    ResetData: true
  "ESP / Bariton":
    BanTime: 1mo
    ResetData: true
  Macroing:
    BanTime: 7d
    ResetData: false
  Cheating:
    BanTime: 30d
    ResetData: true
  Xray:
    BanTime: lifetime
    ResetData: true
  BaseFinding:
    BanTime: 14d
    ResetData: false

alt-ban-policy: new-accounts-only
alt-ban-account-min-age-hours: 168

sus:
  gui-title: "&8Sus ??"
  alert-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  cooldown-ms: 4500

translation:
  minecraft-lang-source: "C:/Users/cpatt/AppData/Roaming/.minecraft/feather/assets/game/lang"

messages:
  prefix: "&x&F&F&5&5&5&5&lSUS &8> "
  no-permission: "&cYou do not have permission."
  player-only: "&cOnly players can use this command."
  player-not-found: "&cThat player is not online."
  usage: "&cUsage: /sus <player> [reason]"
  sus-sent: "&aSuspicion report sent for &f%target%&a."
  sus-alert: "&c%reporter% &7marked &c%target% &7as suspicious&8: &f%reason%"
  freecam-alert: "&c%player% &7failed anti-freecam &8(&f%check%&8)"