  &c&lYOU ARE BANNED

  &7Reason: &f%reason%
  &7Duration: &f%duration%
  &7Time remaining: &f%time_remaining%
  &7Ban ID: &f%ban_id%

  &7Appeal at &fhttps://dc.cloudmc.lol/

