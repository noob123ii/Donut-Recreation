main: ${PACKAGE}.${NAME}
name: ${NAME}
version: "${VERSION}"
api-version: "1.21"
author: Notlucy
description: Donut-style anti-freecam and /sus recreation plugin
commands:
  sus:
    description: Open the sus GUI / mark a player suspicious (OP only)
    usage: "/sus [player] [reason]"
  offend:
    description: Punish a player using a configured reason (OP only)
    usage: "/offend <player> <reason>"
    aliases: [punish]
  unban:
    description: Remove a ban from a player (OP only)
    usage: "/unban <player>"
  donut:
    description: Main plugin command (OP only)
    usage: "/donut reload"
  spawn:
    description: Spawn ephemeral decoy ghost-blocks / NPCs (OP only)
    usage: "/spawn <fakestash|fakespawner|fakeplayer|fakebedrockspawner>"
  settings:
    description: Open the settings GUI
    usage: "/settings"
permissions:
  donutrecreation.alerts:
    description: Receives anti-freecam and sus alerts
    default: op
  donutrecreation.bypass:
    description: Bypasses anti-freecam checks
    default: op
  donutrecreation.hider.bypass:
    description: Bypasses the under-floor block hider (sees the real world below the floor)
    default: op
  donutrecreation.*:
    description: Grants all DonutRecreation permissions
    default: false
    children:
      donutrecreation.alerts: true
      donutrecreation.bypass: true
      donutrecreation.hider.bypass: true